[workspace]
resolver = "2"
members = [
    "crates/kit-slint",
    "crates/kit-theme",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Tristan"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/1337userxyz/slint-desktop-kit"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
slint = "1.18"
slint-build = "1.18"
