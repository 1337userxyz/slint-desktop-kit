[workspace]
resolver = "2"
members = [
    "crates/kit-paths",
    "crates/kit-picker",
    "crates/kit-slint",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Tristan"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/1337userxyz/tristan-kit"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
rfd = "0.17"
slint = "1.18"
thiserror = "2.0"
